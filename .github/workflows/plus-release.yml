name: Plus Release

# 触发条件：推送 plus/v* 格式的 tag
# 例：git tag plus/v0.2.15-plus.1 && git push origin plus/v0.2.15-plus.1
on:
  push:
    tags:
      - 'plus/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的 tag（例：plus/v0.2.15-plus.1），留空则用当前分支构建（不推送镜像）'
        required: false
        type: string

permissions:
  contents: read
  packages: write   # 推送到 GHCR 需要

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/sub2api-plus

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      # 解析版本号：plus/v0.2.15-plus.1 → 0.2.15-plus.1
      - name: Resolve version
        id: meta
        run: |
          RAW_TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${RAW_TAG#plus/v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_NAME}:${VERSION}" >> "$GITHUB_OUTPUT"
          # 如果是 latest（plus/v*-plus.* 中最新），同时打 latest tag
          echo "is_release=${{ github.event_name == 'push' }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: ${{ steps.meta.outputs.is_release == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.plus-local
          push: ${{ steps.meta.outputs.is_release == 'true' }}
          # 版本 tag + latest，workflow_dispatch 只 build 不 push
          tags: |
            ${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.is_release == 'true' && format('{0}:latest', env.IMAGE_NAME) || '' }}
          build-args: |
            GOPROXY=https://goproxy.cn,direct
            GOSUMDB=sum.golang.google.cn
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
          # 用 GitHub Actions 缓存加速二次构建（前端 node_modules、Go mod）
          cache-from: type=gha
          cache-to: type=gha,mode=max
